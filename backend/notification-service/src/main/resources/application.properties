spring.application.name=notification-service
server.port=${PORT:8082}
server.error.include-stacktrace=never
spring.threads.virtual.enabled=true
# SSE connections are long-lived
spring.mvc.async.request-timeout=-1

jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}

app.events.kafka-enabled=${KAFKA_ENABLED:false}
app.events.alerts-topic=alerts.created
app.events.group-id=notification-${random.uuid}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
