spring.application.name=ai-assistant-service
server.port=${PORT:8083}
server.error.include-stacktrace=never
spring.threads.virtual.enabled=true

jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}

# ---- OpenAI (chat + embeddings). Without a real key the service starts but /ask returns 503. ----
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# ---- ChromaDB vector store ----
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8001}
spring.ai.vectorstore.chroma.collection-name=clinical-knowledge
spring.ai.vectorstore.chroma.initialize-schema=true

assistant.ingest-on-startup=true
assistant.top-k=4
assistant.patient-service-url=${PATIENT_SERVICE_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
