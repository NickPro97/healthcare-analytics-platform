spring.application.name=ai-assistant-service
server.port=${PORT:8083}
server.error.include-stacktrace=never
spring.threads.virtual.enabled=true

jwt.secret=${JWT_SECRET}

# ---- Which AI provider: "ollama" (free, runs on your machine - default) or "openai" (paid API) ----
spring.ai.model.chat=${AI_PROVIDER:ollama}
spring.ai.model.embedding=${AI_PROVIDER:ollama}

# ---- Ollama (free, local) ----
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
# Download the models on first start if they are missing (about 2.3 GB once)
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=20m

# ---- OpenAI (optional, paid). Only used when AI_PROVIDER=openai ----
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# ---- ChromaDB vector store ----
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8001}
# One collection per provider: their embeddings have different sizes and cannot be mixed
spring.ai.vectorstore.chroma.collection-name=clinical-knowledge-${AI_PROVIDER:ollama}
spring.ai.vectorstore.chroma.initialize-schema=true

assistant.ingest-on-startup=true
assistant.top-k=4
assistant.patient-service-url=${PATIENT_SERVICE_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
