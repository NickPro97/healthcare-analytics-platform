spring.application.name=patient-service-test

spring.datasource.url=jdbc:h2:mem:patientdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-that-is-at-least-32-bytes-long!!
jwt.expiration=3600000
app.security.admin-password=admin-pass
app.security.clinician-password=clinician-pass

app.events.kafka-enabled=false
app.events.vitals-topic=vitals.recorded

app.ml.base-url=http://localhost:65535
spring.cache.type=simple
management.health.redis.enabled=false
