spring.application.name=patient-service

# ---- Server ----
server.port=${PORT:8080}
server.error.include-stacktrace=never
spring.threads.virtual.enabled=true

# ---- PostgreSQL (override with env vars in Docker / Kubernetes) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patientdb}
spring.datasource.username=${DB_USERNAME:nikhil}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# ---- Security / JWT (JWT_SECRET must be >= 32 characters and identical in every service) ----
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.security.admin-password=${APP_ADMIN_PASSWORD:password123}
app.security.clinician-password=${APP_CLINICIAN_PASSWORD:clinician123}
logging.level.org.springframework.security=INFO

# ---- Kafka events ----
app.events.kafka-enabled=${KAFKA_ENABLED:false}
app.events.vitals-topic=vitals.recorded
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# ---- ML service ----
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}

# ---- Cache: "redis" in Docker/K8s, "simple" (in-memory) when running alone ----
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=10m
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# ---- Actuator (Kubernetes liveness/readiness probes) ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
