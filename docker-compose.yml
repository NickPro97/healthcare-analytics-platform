# Full platform on one machine:  docker compose up -d --build
# Then open http://localhost:3000
name: healthcare-analytics

x-java-env: &java-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  DB_USERNAME: nikhil
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nikhil
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: patientdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]   # 5433 on your Mac so it does not clash with an existing local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikhil -d patientdb"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  chroma:
    image: ghcr.io/chroma-core/chroma:1.0.0
    volumes:
      - chromadata:/data
    ports: ["8001:8000"]

  ml-service:
    build: ./ml-service
    volumes:
      - ./ml-service/models:/app/models
      - ${MIMIC_DATA_DIR:-./data}:/data:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  patient-service:
    build: ./backend/patient-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/patientdb
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in .env}
      APP_CLINICIAN_PASSWORD: ${APP_CLINICIAN_PASSWORD:?set APP_CLINICIAN_PASSWORD in .env}
      ML_SERVICE_URL: http://ml-service:8000
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_HEALTH_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck: &spring-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/$${PORT:-8080}' || exit 1"]
      interval: 10s
      retries: 30

  analytics-service:
    build: ./backend/analytics-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/analyticsdb
      PORT: "8081"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8081:8081"]
    healthcheck: *spring-health

  notification-service:
    build: ./backend/notification-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PORT: "8082"
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8082:8082"]
    healthcheck: *spring-health

  ai-assistant-service:
    build: ./backend/ai-assistant-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      CHROMA_HOST: http://chroma
      CHROMA_PORT: "8000"
      PATIENT_SERVICE_URL: http://patient-service:8080
      PORT: "8083"
    depends_on:
      - chroma
      - patient-service
    restart: on-failure
    ports: ["8083:8083"]

  frontend:
    build: ./frontend
    depends_on:
      - patient-service
      - analytics-service
      - notification-service
    ports: ["3000:8080"]

volumes:
  pgdata:
  chromadata:
