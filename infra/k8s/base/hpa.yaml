# Scale the API tier on CPU (needs metrics-server; installed by default on EKS add-on, see infra/eks).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patient-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: patient-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
