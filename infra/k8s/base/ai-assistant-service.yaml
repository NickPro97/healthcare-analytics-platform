apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-assistant-service }
  template:
    metadata:
      labels: { app: ai-assistant-service }
    spec:
      containers:
        - name: ai-assistant-service
          image: hap/ai-assistant-service:0.1.0
          ports: [{ containerPort: 8083 }]
          env:
            - { name: CHROMA_HOST, valueFrom: { configMapKeyRef: { name: hap-config, key: CHROMA_HOST } } }
            - { name: CHROMA_PORT, valueFrom: { configMapKeyRef: { name: hap-config, key: CHROMA_PORT } } }
            - { name: PATIENT_SERVICE_URL, valueFrom: { configMapKeyRef: { name: hap-config, key: PATIENT_SERVICE_URL } } }
            - { name: AI_PROVIDER, valueFrom: { configMapKeyRef: { name: hap-config, key: AI_PROVIDER } } }
            - { name: OLLAMA_BASE_URL, valueFrom: { configMapKeyRef: { name: hap-config, key: OLLAMA_BASE_URL } } }
            - { name: OLLAMA_CHAT_MODEL, valueFrom: { configMapKeyRef: { name: hap-config, key: OLLAMA_CHAT_MODEL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: hap-secrets, key: JWT_SECRET } } }
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: hap-secrets, key: OPENAI_API_KEY } } }
            - { name: PORT, value: "8083" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant-service
spec:
  selector: { app: ai-assistant-service }
  ports: [{ port: 8083 }]
