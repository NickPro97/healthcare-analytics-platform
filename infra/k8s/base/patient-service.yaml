apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: patient-service }
  template:
    metadata:
      labels: { app: patient-service }
    spec:
      containers:
        - name: patient-service
          image: hap/patient-service:0.1.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KAFKA_ENABLED, valueFrom: { configMapKeyRef: { name: hap-config, key: KAFKA_ENABLED } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: hap-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: DB_USERNAME, valueFrom: { configMapKeyRef: { name: hap-config, key: DB_USERNAME } } }
            - { name: ML_SERVICE_URL, valueFrom: { configMapKeyRef: { name: hap-config, key: ML_SERVICE_URL } } }
            - { name: CACHE_TYPE, valueFrom: { configMapKeyRef: { name: hap-config, key: CACHE_TYPE } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: hap-config, key: REDIS_HOST } } }
            - { name: REDIS_HEALTH_ENABLED, valueFrom: { configMapKeyRef: { name: hap-config, key: REDIS_HEALTH_ENABLED } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: hap-secrets, key: JWT_SECRET } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: hap-secrets, key: DB_PASSWORD } } }
            - { name: APP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: hap-secrets, key: APP_ADMIN_PASSWORD } } }
            - { name: APP_CLINICIAN_PASSWORD, valueFrom: { secretKeyRef: { name: hap-secrets, key: APP_CLINICIAN_PASSWORD } } }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/patientdb" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  selector: { app: patient-service }
  ports: [{ port: 8080 }]
