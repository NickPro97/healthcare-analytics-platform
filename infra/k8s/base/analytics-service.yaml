apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics-service }
  template:
    metadata:
      labels: { app: analytics-service }
    spec:
      containers:
        - name: analytics-service
          image: hap/analytics-service:0.1.0
          ports: [{ containerPort: 8081 }]
          env:
            - { name: KAFKA_ENABLED, valueFrom: { configMapKeyRef: { name: hap-config, key: KAFKA_ENABLED } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: hap-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: DB_USERNAME, valueFrom: { configMapKeyRef: { name: hap-config, key: DB_USERNAME } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: hap-secrets, key: JWT_SECRET } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: hap-secrets, key: DB_PASSWORD } } }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/analyticsdb" }
            - { name: PORT, value: "8081" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector: { app: analytics-service }
  ports: [{ port: 8081 }]
