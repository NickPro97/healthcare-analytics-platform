apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: hap/notification-service:0.1.0
          ports: [{ containerPort: 8082 }]
          env:
            - { name: KAFKA_ENABLED, valueFrom: { configMapKeyRef: { name: hap-config, key: KAFKA_ENABLED } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: hap-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: hap-secrets, key: JWT_SECRET } } }
            - { name: PORT, value: "8082" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports: [{ port: 8082 }]
